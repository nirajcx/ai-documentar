# App-only runtime: reuses existing external PostgreSQL, Redis, S3 and Ollama.
# Never mounts, recreates or upgrades the existing PostgreSQL data volume.
name: documentar-runtime

x-backend: &backend
  image: documentar-api:local
  build:
    context: ../backend
    target: production
  env_file: .env.runtime
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs: ["/tmp:size=512m,mode=1777"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  api:
    <<: *backend
    ports: ["127.0.0.1:8001:8000"]
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
    mem_limit: 2g
  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--hostname=worker@%h", "--max-tasks-per-child=20"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping --destination worker@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    mem_limit: 2g
  scheduler:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    mem_limit: 256m
  web:
    image: documentar-web:local
    build:
      context: ../frontend
      target: production
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
      API_INTERNAL_URL: http://api:8000/api/v1
    ports: ["127.0.0.1:3001:3000"]
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 1g
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/chat').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
