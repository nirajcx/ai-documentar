name: ai-documenter-dev

x-api-environment: &api-environment
  ENVIRONMENT: development
  LOG_LEVEL: INFO
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:admin123@postgres:5432/ai_documenter}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-admin}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-admin123}
  S3_BUCKET: ${S3_BUCKET:-documentar}
  S3_REGION: ${S3_REGION:-us-east-1}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://192.168.1.4:11434}

  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RAG_ENABLED: ${RAG_ENABLED:-false}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
  RAG_MAX_DISTANCE: ${RAG_MAX_DISTANCE:-0.65}
  DOCUMENT_MAX_COUNT: ${DOCUMENT_MAX_COUNT:-100}
  DOCUMENT_QUOTA_BYTES: ${DOCUMENT_QUOTA_BYTES:-524288000}
  CHAT_PROVIDER: ${CHAT_PROVIDER:-groq}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
  GROQ_REASONING_EFFORT: ${GROQ_REASONING_EFFORT:-low}
  GROQ_MAX_COMPLETION_TOKENS: ${GROQ_MAX_COMPLETION_TOKENS:-2048}
  OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}

services:
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      API_INTERNAL_URL: http://api:8000/api/v1
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - web-next:/app/.next

  api:
    build:
      context: ../backend
      target: development
    command: sh -c 'alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload'
    environment: *api-environment
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 5
    volumes:
      - ../backend/app:/app/app
      - ../backend/migrations:/app/migrations
      - ../backend/main.py:/app/main.py

  scheduler:
    build:
      context: ../backend
      target: development
    environment: *api-environment
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../backend/app:/app/app
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ../backend
      target: development
    environment: *api-environment
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../backend/app:/app/app
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-ai_documenter}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin123}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  minio-data:
  web-next:
