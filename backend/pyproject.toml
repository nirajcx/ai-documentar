[project]
name = "documentar-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "celery[redis]>=5.5,<6",
  "boto3>=1.37,<2",
  "httpx>=0.28,<1",
  "anyio>=4,<5",
  "openai>=2,<3",
  "argon2-cffi>=25,<26",
  "email-validator>=2,<3",
  "pgvector>=0.3,<1",
  "pypdf>=5,<7",
  "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
